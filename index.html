    <!-- One request, three families, only the weights the app actually uses:
         Fraunces is a variable font (single file per subset) covering wght
         100-900 + opsz 9-144, which is what the bolded headings need.
         IBM Plex Mono tops out at 500 because mono text is never bolded. -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,100..900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Preload the LCP background image so the browser fetches it in
         parallel with the HTML/CSS. imagesrcset lets the browser pick
         the right size for the viewport. -->
    <link
      rel="preload"
      as="image"
      href="/pexels-1920.webp"
      imagesrcset="/pexels-640.webp 640w, /pexels-1280.webp 1280w, /pexels-1920.webp 1920w, /pexels-2560.webp 2560w"
      imagesizes="100vw"
      type="image/webp"
